name: Publish to the Comfy Registry

on:
  push:
    branches:
      - main
    paths:
      - pyproject.toml
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check for a Registry key
        id: key
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: |
          if [ -n "$REGISTRY_ACCESS_TOKEN" ]; then
            echo "set=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::The Comfy Registry publish is skipped because REGISTRY_ACCESS_TOKEN is not set."
            echo "set=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check out
        if: steps.key.outputs.set == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        if: steps.key.outputs.set == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install comfy-cli
        if: steps.key.outputs.set == 'true'
        run: python -m pip install --require-hashes --no-deps --only-binary ':all:' -r .github/publish-requirements.txt
      - name: Publish to the Comfy Registry
        if: steps.key.outputs.set == 'true'
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: comfy --skip-prompt --no-enable-telemetry node publish --token "$REGISTRY_ACCESS_TOKEN"
